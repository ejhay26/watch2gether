name: Multiplatform Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.6)"
        required: false
        default: "v1.0.6"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Android Universal Release APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.vars.outputs.tag }}"
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/watch2gether-android-universal-${TAG}.apk"
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/watch2gether-android-universal.apk"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*.apk
          retention-days: 7

  build-windows:
    name: Build Windows Desktop Executables
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install inno-setup -y --no-progress

      - name: Enable Windows Desktop in Flutter
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Windows Desktop Release
        working-directory: frontend
        run: flutter build windows --release

      - name: Package Windows Setup Installer (.exe) and Portable (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $tag = "${{ steps.vars.outputs.tag }}"

          # 1. Compile Inno Setup Installer (.exe)
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if ($iscc) {
            & $iscc /DMyAppVersion="$tag" frontend/windows/installer/inno_setup.iss
            if (Test-Path "release-artifacts/watch2gether-windows-x64-setup.exe") {
              Copy-Item "release-artifacts/watch2gether-windows-x64-setup.exe" "release-artifacts/watch2gether-windows-x64-setup-$tag.exe" -Force
            }
          }

          # 2. Package Portable Single Executable (.exe) via 7z SFX
          $sfxCandidates = @(
            "C:\Program Files\7-Zip\7z.sfx",
            "C:\Program Files (x86)\7-Zip\7z.sfx",
            "$env:ProgramFiles\7-Zip\7z.sfx"
          )
          $sfxModule = $sfxCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($sfxModule) {
            $sfxCfg = ";!@Install@!UTF-8!`r`nTitle=`"Watch2Gether Portable`"`r`nRunProgram=`"watch2gether.exe`"`r`n;!@InstallEnd@!`r`n"
            Set-Content -Path "sfx_config.txt" -Value $sfxCfg -Encoding UTF8
            & 7z a -mx=9 "app_data.7z" "./frontend/build/windows/x64/runner/Release/*"
            cmd.exe /c "copy /b `"$sfxModule`" + sfx_config.txt + app_data.7z `"release-artifacts\watch2gether-windows-x64-portable-$tag.exe`""
            Copy-Item "release-artifacts/watch2gether-windows-x64-portable-$tag.exe" "release-artifacts/watch2gether-windows-x64-portable.exe" -Force
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/*.exe
          retention-days: 7

  build-linux:
    name: Build Linux Standalone AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv file wget

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Enable Linux Desktop in Flutter
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Linux Release
        working-directory: frontend
        run: flutter build linux --release

      - name: Package Linux Standalone AppImage (.AppImage)
        run: |
          mkdir -p release-artifacts AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
          TAG="${{ steps.vars.outputs.tag }}"
          
          # Copy Flutter bundle to AppDir
          cp -r frontend/build/linux/x64/release/bundle/* AppDir/usr/bin/
          if [ -f "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" ]; then
            cp "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" AppDir/watch2gether.png
            cp "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" AppDir/usr/share/icons/hicolor/256x256/apps/watch2gether.png
            cp "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" AppDir/.DirIcon
          fi
          
          # Create .desktop file
          printf '[Desktop Entry]\nName=Watch2Gether\nComment=Watch movies and anime in sync with friends\nExec=watch2gether\nIcon=watch2gether\nTerminal=false\nType=Application\nCategories=AudioVideo;Video;Player;\n' > AppDir/watch2gether.desktop
          
          # Create AppRun
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexport LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${HERE}/usr/lib:${LD_LIBRARY_PATH}"\nexec "${HERE}/usr/bin/watch2gether" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          
          # Download appimagetool and generate AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "release-artifacts/watch2gether-linux-x86_64-${TAG}.AppImage"
          cp "release-artifacts/watch2gether-linux-x86_64-${TAG}.AppImage" "release-artifacts/watch2gether-linux-x86_64.AppImage"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-artifacts/*.AppImage
          retention-days: 7

  build-macos:
    name: Build macOS Universal DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Enable macOS Desktop in Flutter
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build macOS Release Application Bundle
        working-directory: frontend
        run: flutter build macos --release

      - name: Package macOS Universal DMG (.dmg)
        run: |
          mkdir -p release-artifacts dmg_root
          TAG="${{ steps.vars.outputs.tag }}"
          
          # Prepare DMG root with app bundle and Applications shortcut
          cp -R "frontend/build/macos/Build/Products/Release/watch2gether.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          
          # Create universal DMG image
          hdiutil create -volname "Watch2Gether" -srcfolder dmg_root -ov -format UDZO "release-artifacts/watch2gether-macos-universal-${TAG}.dmg"
          cp "release-artifacts/watch2gether-macos-universal-${TAG}.dmg" "release-artifacts/watch2gether-macos-universal.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-artifacts/*.dmg
          retention-days: 7

  publish-release:
    name: Publish Multiplatform GitHub Release
    needs: [build-android, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-files

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-files

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-files

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate Multiplatform Release Notes Body
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          REPO="${{ github.repository }}"

          cat << 'EOF' > release_notes.md
          # 🎬 Watch2Gether Release
          Official multiplatform release of Watch2Gether supporting Android, Windows, Linux, and macOS. All downloads are provided as pure native OS executables and packages without generic zip archives.

          ### 📥 Direct Application Downloads (Native OS Executables)

          | Platform | Target Architecture | Direct Download Link | Format |
          |:---:|:---|:---|:---:|
          | 📱 **Android** | Android 7.0+ (ARM64 / ARMv7 / x86_64) | [**Download Android Universal APK**](https://github.com/REPO_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/watch2gether-android-universal-TAG_PLACEHOLDER.apk) | `.apk` |
          | 🪟 **Windows** | Windows 10 / 11 (Setup Installer) | [**Download Windows Setup Installer**](https://github.com/REPO_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/watch2gether-windows-x64-setup-TAG_PLACEHOLDER.exe) | `.exe` |
          | 🪟 **Windows** | Windows 10 / 11 (Portable Executable) | [**Download Windows Portable (.exe)**](https://github.com/REPO_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/watch2gether-windows-x64-portable-TAG_PLACEHOLDER.exe) | `.exe` |
          | 🍏 **macOS** | Apple Silicon & Intel Macs | [**Download macOS Universal DMG**](https://github.com/REPO_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/watch2gether-macos-universal-TAG_PLACEHOLDER.dmg) | `.dmg` |
          | 🐧 **Linux** | All Linux Distributions (x86_64) | [**Download Linux Standalone AppImage**](https://github.com/REPO_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/watch2gether-linux-x86_64-TAG_PLACEHOLDER.AppImage) | `.AppImage` |

          ---

          ### ✨ What's New
          - **Multiplatform Native OS Packages**: Pure native executables and packages across Android (.apk), Windows (.exe installer & portable), Linux (.AppImage), and macOS Universal (.dmg). No generic zip or tar compression archives.
          - **Elevated Floating Mini-Player**: Picture-in-picture miniplayer hovers cleanly above the floating navigation bar with zero occlusion.
          - **Authentic English DUB & Multi-Language Subtitles**: Direct audio endpoint routing with support for English Dub and Japanese Sub, plus 9 subtitle languages (English, Spanish, French, German, Italian, Portuguese, Russian, Arabic).
          - **Accurate Anime Series Episode Mapping**: Fixed slug resolution to prevent series IDs from resolving to unrelated shows and mapped canonical episode indices correctly.
          - **Standardized Frosted Glass Theme**: Polished dark translucent frosted glass interface with subtle Gaussian blur and refined hairline borders.
          EOF
          sed -i "s|REPO_PLACEHOLDER|${REPO}|g" release_notes.md
          sed -i "s|TAG_PLACEHOLDER|${TAG}|g" release_notes.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Watch2Gether Release ${{ steps.vars.outputs.tag }}"
          body_path: release_notes.md
          draft: true
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
