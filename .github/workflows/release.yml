name: Multiplatform Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.7)"
        required: false
        default: "v1.0.7"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build Embedded Go Companion Shared Library for Android (libgo_backend.so)
        shell: bash
        run: |
          mkdir -p frontend/android/app/src/main/jniLibs/arm64-v8a
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          fi
          
          CLANG=$(find "$NDK_DIR/toolchains/llvm/prebuilt" -name "aarch64-linux-android*-clang" 2>/dev/null | grep -v "clang++" | head -n 1)
          
          if [ -n "$CLANG" ] && [ -x "$CLANG" ]; then
            echo "Cross-compiling Go backend to Android arm64-v8a using $CLANG..."
            (
              cd backend
              CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CLANG" go build -buildmode=c-shared -ldflags "-s -w" -o "../frontend/android/app/src/main/jniLibs/arm64-v8a/libgo_backend.so" ./cmd/mobile
            ) || echo "Notice: Go CGO compilation skipped or non-fatal error, proceeding with standard APK."
            echo "libgo_backend.so staging complete."
          else
            echo "Notice: Android NDK clang not found. Proceeding with standard APK build."
          fi

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Android Universal Release APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.vars.outputs.tag }}"
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/watch2gether-android-universal-${TAG}.apk"
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/watch2gether-android-universal.apk"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*.apk
          retention-days: 7

  build-windows:
    name: Build Windows Desktop Executables & MSI
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Determine Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          try {
            choco install innosetup -y --no-progress
          } catch {
            Write-Host "Choco install encountered an issue, trying direct setup installer..."
          }
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            Write-Host "Downloading Inno Setup official installer..."
            Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe" -OutFile "is_setup.exe"
            Start-Process -FilePath ".\is_setup.exe" -ArgumentList "/VERYSILENT", "/ALLUSERS", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          }

      - name: Enable Windows Desktop in Flutter
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Windows Desktop Release
        working-directory: frontend
        run: flutter build windows --release

      - name: Build Go Companion Server (Bundled Sidecar)
        working-directory: backend
        run: go build -ldflags "-s -w" -o "../frontend/build/windows/x64/runner/Release/server.exe" ./cmd/server

      - name: Package Windows MSI Installer (.msi)
        shell: pwsh
        run: |
          try {
            $tag = "${{ steps.vars.outputs.tag }}"
            & frontend/windows/installer/build_msi.ps1 -Tag "$tag" -ReleaseDir "frontend/build/windows/x64/runner/Release" -OutputDir "release-artifacts"
          } catch {
            Write-Warning "MSI build encountered an issue, proceeding with portable and setup installers: $_"
          }

      - name: Package Windows Setup Installer (.exe) and Portable Standalone (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $tag = "${{ steps.vars.outputs.tag }}"

          # 1. Compile Inno Setup Installer (.exe)
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if ($iscc) {
            & $iscc /DMyAppVersion="$tag" frontend/windows/installer/inno_setup.iss
            if (Test-Path "release-artifacts/watch2gether-windows-x64-setup.exe") {
              Copy-Item "release-artifacts/watch2gether-windows-x64-setup.exe" "release-artifacts/watch2gether-windows-x64-setup-$tag.exe" -Force
            }
          }

          # 2. Package True Standalone Portable Executable (.exe) without extraction prompt
          Push-Location "frontend/windows/portable"
          Compress-Archive -Path "../../build/windows/x64/runner/Release/*" -DestinationPath "app.zip" -Force
          go build -ldflags "-H=windowsgui -s -w" -o "../../../release-artifacts/watch2gether-windows-x64-portable-$tag.exe" .
          Pop-Location
          Copy-Item "release-artifacts/watch2gether-windows-x64-portable-$tag.exe" "release-artifacts/watch2gether-windows-x64-portable.exe" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release-artifacts/*.exe
            release-artifacts/*.msi
          retention-days: 7

  build-linux:
    name: Build Linux AppImage and DEB Package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv file wget dpkg libpulse-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Enable Linux Desktop in Flutter
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Linux Release
        working-directory: frontend
        run: flutter build linux --release

      - name: Build Go Companion Server (Bundled Sidecar)
        working-directory: backend
        run: go build -ldflags "-s -w" -o "../frontend/build/linux/x64/release/bundle/server" ./cmd/server

      - name: Package Linux Standalone AppImage (.AppImage)
        run: |
          mkdir -p release-artifacts AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
          TAG="${{ steps.vars.outputs.tag }}"
          
          # Copy Flutter bundle (and bundled server) to AppDir
          cp -r frontend/build/linux/x64/release/bundle/* AppDir/usr/bin/
          if [ -f "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" ]; then
            cp "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" AppDir/watch2gether.png
            cp "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" AppDir/usr/share/icons/hicolor/256x256/apps/watch2gether.png
            cp "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" AppDir/.DirIcon
          fi
          
          # Create .desktop file
          printf '[Desktop Entry]\nName=Watch2Gether\nComment=Watch movies and anime in sync with friends\nExec=watch2gether\nIcon=watch2gether\nTerminal=false\nType=Application\nCategories=AudioVideo;Video;Player;\n' > AppDir/watch2gether.desktop
          
          # Create AppRun (runs server in background if not running, cleanly traps exit)
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexport LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${HERE}/usr/lib:${LD_LIBRARY_PATH}"\nif [ -f "${HERE}/usr/bin/server" ]; then\n  "${HERE}/usr/bin/server" &\n  SERVER_PID=$!\n  trap '\''kill $SERVER_PID 2>/dev/null'\'' EXIT\nfi\nexec "${HERE}/usr/bin/watch2gether" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          
          # Download appimagetool and generate AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "release-artifacts/watch2gether-linux-x86_64-${TAG}.AppImage"
          cp "release-artifacts/watch2gether-linux-x86_64-${TAG}.AppImage" "release-artifacts/watch2gether-linux-x86_64.AppImage"

      - name: Package Debian/Ubuntu Package (.deb)
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          DEB_DIR="deb_root"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/opt/watch2gether"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/512x512/apps"

          cp -r frontend/build/linux/x64/release/bundle/* "$DEB_DIR/opt/watch2gether/"
          ln -s "/opt/watch2gether/watch2gether" "$DEB_DIR/usr/bin/watch2gether"
          if [ -f "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" ]; then
            cp "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" "$DEB_DIR/usr/share/icons/hicolor/512x512/apps/watch2gether.png"
          fi

          printf '[Desktop Entry]\nName=Watch2Gether\nComment=Watch movies and anime in sync with friends\nExec=/usr/bin/watch2gether\nIcon=watch2gether\nTerminal=false\nType=Application\nCategories=AudioVideo;Video;Player;\n' > "$DEB_DIR/usr/share/applications/watch2gether.desktop"

          DEB_VERSION=$(echo "$TAG" | sed 's/^v//')
          printf "Package: watch2gether\nVersion: %s\nSection: video\nPriority: optional\nArchitecture: amd64\nMaintainer: Watch2Gether Team <support@watch2gether.app>\nDescription: Watch movies and anime in sync with friends\n Modern, fluid synchronized streaming player built with Flutter and Go.\n" "$DEB_VERSION" > "$DEB_DIR/DEBIAN/control"

          chmod 755 "$DEB_DIR/DEBIAN"
          dpkg-deb --build "$DEB_DIR" "release-artifacts/watch2gether-linux-amd64-${TAG}.deb"
          cp "release-artifacts/watch2gether-linux-amd64-${TAG}.deb" "release-artifacts/watch2gether-linux-amd64.deb"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release-artifacts/*.AppImage
            release-artifacts/*.deb
          retention-days: 7

  build-macos:
    name: Build macOS Universal DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Enable macOS Desktop in Flutter
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build macOS Release Application Bundle
        working-directory: frontend
        run: flutter build macos --release

      - name: Package macOS Universal DMG (.dmg)
        run: |
          mkdir -p release-artifacts dmg_root
          TAG="${{ steps.vars.outputs.tag }}"
          
          # Prepare DMG root with app bundle and Applications shortcut
          cp -R "frontend/build/macos/Build/Products/Release/watch2gether.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          
          # Create universal DMG image
          hdiutil create -volname "Watch2Gether" -srcfolder dmg_root -ov -format UDZO "release-artifacts/watch2gether-macos-universal-${TAG}.dmg"
          cp "release-artifacts/watch2gether-macos-universal-${TAG}.dmg" "release-artifacts/watch2gether-macos-universal.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-artifacts/*.dmg
          retention-days: 7

  publish-release:
    name: Publish Multiplatform GitHub Release
    if: always() && !cancelled()
    needs: [build-android, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-release
          path: release-files

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-release
          path: release-files

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-release
          path: release-files

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-release
          path: release-files

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate Multiplatform Release Notes Body
        run: |
          python3 -c '
          import os, sys
          tag = os.environ.get("TAG", "v1.0.7")
          repo = os.environ.get("REPO", "ejhay26/watch2gether")
          body = f"""### What'\''s Changed in {tag}
          - **Bundled Go Fiber Companion Engine**: The Windows and Linux desktop binaries automatically bundle the Go Fiber scraper and room engine. When you launch Watch2Gether, the companion server starts silently in the background with zero terminal windows or manual configuration required.
          - **Beautiful Splash Loading Window**: High-end frosted liquid-glass window with breathing brand glyph and live telemetry before smoothly expanding into the main app.
          - **Complete UI/UX Overhaul & Polish**: Fluid Cupertino-inspired animations, liquid-glass frosted components, gesture-driven bottom sheets, and responsive layouts across all viewports.
          - **New High-Resolution Brand Identity & Native App Icons**: Fresh geometric brand mark and app icons embedded across Windows (.ico), Android (adaptive mipmaps), macOS (AppIcon.appiconset), and Linux.
          - **True Standalone Windows Portable Executable**: Zero external folders or loose DLLs. A single self-contained .exe with embedded icon that launches instantaneously on double-click.
          - **Native MSI Installer**: Standardized Windows .msi package powered by WiX Toolset for enterprise deployment and clean uninstallation.
          - **Native Linux DEB Package & AppImage**: Dual Linux distribution formats (.deb for Ubuntu/Debian and portable .AppImage for all distributions).
          - **Universal macOS DMG & Android APK**: Ready-to-install packages for all supported platforms.
          - **Hybrid Local-First Architecture**: Instant offline persistence with optional Supabase cloud sync and peer-to-peer LAN mesh party synchronization.

          ### Direct Application Downloads

          | Platform | Target Architecture | Direct Download Link | Format |
          |:---:|:---|:---|:---:|
          | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/android/android-original.svg" width="20" height="20" alt="Android" /> | Android 7.0+ (Universal) | [Download Android Universal APK](https://github.com/{repo}/releases/download/{tag}/watch2gether-android-universal.apk) | `.apk` |
          | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" width="20" height="20" alt="Windows" /> | Windows 10 / 11 (Portable Executable - Single File) | [Download Windows Portable Executable](https://github.com/{repo}/releases/download/{tag}/watch2gether-windows-x64-portable.exe) | `.exe` |
          | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" width="20" height="20" alt="Windows" /> | Windows 10 / 11 (MSI Installer) | [Download Windows MSI Installer](https://github.com/{repo}/releases/download/{tag}/watch2gether-windows-x64.msi) | `.msi` |
          | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" width="20" height="20" alt="Windows" /> | Windows 10 / 11 (Setup Installer) | [Download Windows Setup Installer](https://github.com/{repo}/releases/download/{tag}/watch2gether-windows-x64-setup.exe) | `.exe` |
          | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" width="20" height="20" alt="macOS" /> | Apple Silicon & Intel Macs | [Download macOS Universal DMG](https://github.com/{repo}/releases/download/{tag}/watch2gether-macos-universal.dmg) | `.dmg` |
          | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg" width="20" height="20" alt="Linux" /> | All Linux Distros (x86_64 AppImage) | [Download Linux Standalone AppImage](https://github.com/{repo}/releases/download/{tag}/watch2gether-linux-x86_64.AppImage) | `.AppImage` |
          | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/debian/debian-original.svg" width="20" height="20" alt="Debian" /> | Debian / Ubuntu 20.04+ (amd64) | [Download Debian/Ubuntu Package](https://github.com/{repo}/releases/download/{tag}/watch2gether-linux-amd64.deb) | `.deb` |
          """
          # Strip leading indentation from multiline docstring
          clean_lines = [line.strip() for line in body.split("\n")]
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(clean_lines))
          '
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: ${{ github.repository }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Watch2Gether Release ${{ steps.vars.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
