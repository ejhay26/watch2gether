name: Multiplatform Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.6)"
        required: false
        default: "v1.0.6"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Android Universal Release APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.vars.outputs.tag }}"
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/watch2gether-android-universal-${TAG}.apk"
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/watch2gether-android-universal.apk"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*.apk
          retention-days: 7

  build-windows:
    name: Build Windows Desktop Executables
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          try {
            choco install innosetup -y --no-progress
          } catch {
            Write-Host "Choco install encountered an issue, trying direct setup installer..."
          }
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            Write-Host "Downloading Inno Setup official installer..."
            Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe" -OutFile "is_setup.exe"
            Start-Process -FilePath ".\is_setup.exe" -ArgumentList "/VERYSILENT", "/ALLUSERS", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          }

      - name: Enable Windows Desktop in Flutter
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Windows Desktop Release
        working-directory: frontend
        run: flutter build windows --release

      - name: Package Windows Setup Installer (.exe) and Portable (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $tag = "${{ steps.vars.outputs.tag }}"

          # 1. Compile Inno Setup Installer (.exe)
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if ($iscc) {
            & $iscc /DMyAppVersion="$tag" frontend/windows/installer/inno_setup.iss
            if (Test-Path "release-artifacts/watch2gether-windows-x64-setup.exe") {
              Copy-Item "release-artifacts/watch2gether-windows-x64-setup.exe" "release-artifacts/watch2gether-windows-x64-setup-$tag.exe" -Force
            }
          }

          # 2. Package True Standalone Portable Executable (.exe) without extraction prompt
          Push-Location "frontend/windows/portable"
          Compress-Archive -Path "../../build/windows/x64/runner/Release/*" -DestinationPath "app.zip" -Force
          go build -ldflags "-H=windowsgui -s -w" -o "../../../release-artifacts/watch2gether-windows-x64-portable-$tag.exe" main.go
          Pop-Location
          Copy-Item "release-artifacts/watch2gether-windows-x64-portable-$tag.exe" "release-artifacts/watch2gether-windows-x64-portable.exe" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/*.exe
          retention-days: 7

  build-linux:
    name: Build Linux Standalone AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv file wget

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Enable Linux Desktop in Flutter
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Linux Release
        working-directory: frontend
        run: flutter build linux --release

      - name: Package Linux Standalone AppImage (.AppImage)
        run: |
          mkdir -p release-artifacts AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
          TAG="${{ steps.vars.outputs.tag }}"
          
          # Copy Flutter bundle to AppDir
          cp -r frontend/build/linux/x64/release/bundle/* AppDir/usr/bin/
          if [ -f "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" ]; then
            cp "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" AppDir/watch2gether.png
            cp "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" AppDir/usr/share/icons/hicolor/256x256/apps/watch2gether.png
            cp "frontend/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" AppDir/.DirIcon
          fi
          
          # Create .desktop file
          printf '[Desktop Entry]\nName=Watch2Gether\nComment=Watch movies and anime in sync with friends\nExec=watch2gether\nIcon=watch2gether\nTerminal=false\nType=Application\nCategories=AudioVideo;Video;Player;\n' > AppDir/watch2gether.desktop
          
          # Create AppRun
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexport LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${HERE}/usr/lib:${LD_LIBRARY_PATH}"\nexec "${HERE}/usr/bin/watch2gether" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          
          # Download appimagetool and generate AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "release-artifacts/watch2gether-linux-x86_64-${TAG}.AppImage"
          cp "release-artifacts/watch2gether-linux-x86_64-${TAG}.AppImage" "release-artifacts/watch2gether-linux-x86_64.AppImage"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-artifacts/*.AppImage
          retention-days: 7

  build-macos:
    name: Build macOS Universal DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Enable macOS Desktop in Flutter
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build macOS Release Application Bundle
        working-directory: frontend
        run: flutter build macos --release

      - name: Package macOS Universal DMG (.dmg)
        run: |
          mkdir -p release-artifacts dmg_root
          TAG="${{ steps.vars.outputs.tag }}"
          
          # Prepare DMG root with app bundle and Applications shortcut
          cp -R "frontend/build/macos/Build/Products/Release/watch2gether.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          
          # Create universal DMG image
          hdiutil create -volname "Watch2Gether" -srcfolder dmg_root -ov -format UDZO "release-artifacts/watch2gether-macos-universal-${TAG}.dmg"
          cp "release-artifacts/watch2gether-macos-universal-${TAG}.dmg" "release-artifacts/watch2gether-macos-universal.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-artifacts/*.dmg
          retention-days: 7

  publish-release:
    name: Publish Multiplatform GitHub Release
    needs: [build-android, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-files

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-files

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-files

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate Multiplatform Release Notes Body
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          REPO="${{ github.repository }}"

          cat << 'EOF' > release_notes.md
### What's Changed in TAG_PLACEHOLDER
  - **Elevated Floating Mini-Player & Z-Index Layering**: Lifted the picture-in-picture floating mini-player by 14px above the bottom frosted navigation bar to prevent UI overlap and occlusion.
  - **Strict Movie vs. Anime Scraper Isolation & Exact Slug Matching**: Isolated movie entities (`tmdb-movie-`) strictly from the anime scraper pipeline and enforced exact slug match ranking, filtering out extraneous junk and documentary making-of featurettes.
  - **Granular Per-Film Source Registry & Resolution Auditing**: Introduced a dedicated tracked source registry (`TrackedSourceRegistry`) and audit endpoint (`/api/v1/sources/tracked`) to pinpoint and verify exact sources for specific films without altering working titles.
  - **Multi-Source Streaming Headers & CDN Delivery**: Injected browser headers (`User-Agent`, `Referer`) across HLS playlists and media segments, preventing CDN edge drops on Vidmoly/FlixHQ mirrors.
  - **Removal of Misleading Audio/Dub Toggle**: Removed the `SUB (Japanese) / DUB (English)` toggle from media overview preview cards to eliminate false dub expectations on Western catalog films and live-action series.
  - **True Standalone Windows Portable Executable**: Engineered a native silent launcher for Windows that opens WatchHub immediately upon double-click with zero extraction dialogs or prompts.
  - **Multiplatform Native Packaging**: Automated building and distribution of native platform executables (`.apk`, `.exe`, `.dmg`, `.AppImage`) without generic archive wrappers.

### Direct Application Downloads

| Platform | Target Architecture | Direct Download Link | Format |
|:---:|:---|:---|:---:|
| <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/android/android-original.svg" width="20" height="20" alt="Android" /> | Android 7.0+ (Universal) | [Download Android Universal APK](https://github.com/REPO_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/watch2gether-android-universal.apk) | `.apk` |
| <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" width="20" height="20" alt="Windows" /> | Windows 10 / 11 (Setup Installer) | [Download Windows Setup Installer](https://github.com/REPO_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/watch2gether-windows-x64-setup.exe) | `.exe` |
| <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" width="20" height="20" alt="Windows" /> | Windows 10 / 11 (Portable Executable) | [Download Windows Portable Executable](https://github.com/REPO_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/watch2gether-windows-x64-portable.exe) | `.exe` |
| <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" width="20" height="20" alt="macOS" /> | Apple Silicon & Intel Macs | [Download macOS Universal DMG](https://github.com/REPO_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/watch2gether-macos-universal.dmg) | `.dmg` |
| <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg" width="20" height="20" alt="Linux" /> | All Linux Distros (x86_64) | [Download Linux Standalone AppImage](https://github.com/REPO_PLACEHOLDER/releases/download/TAG_PLACEHOLDER/watch2gether-linux-x86_64.AppImage) | `.AppImage` |
EOF
          sed -i "s|REPO_PLACEHOLDER|${REPO}|g" release_notes.md
          sed -i "s|TAG_PLACEHOLDER|${TAG}|g" release_notes.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Watch2Gether Release ${{ steps.vars.outputs.tag }}"
          body_path: release_notes.md
          draft: true
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
