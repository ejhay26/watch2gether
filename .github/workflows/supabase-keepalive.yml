name: Supabase 24/7 Keep-Alive & Auto-Restore

on:
  schedule:
    # Runs daily at 04:00 UTC (well within Supabase's 7-day inactivity pause limit)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keepalive:
    name: Supabase Database Heartbeat
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Execute Live Database Heartbeat (PostgreSQL Engine Transaction)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          go run ./cmd/keepalive/main.go

      - name: Optional Management API Auto-Unpause (Fallback)
        if: failure()
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          PROJECT_REF="${SUPABASE_PROJECT_REF:-xlciaxmmpqggacedbtsy}"
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Direct query failed. Triggering Supabase Management API auto-unpause for $PROJECT_REF..."
            curl -s -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/unpause" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json"
            echo "Unpause signal transmitted."
          else
            echo "Notice: SUPABASE_ACCESS_TOKEN secret is not set. If project was paused, unpause from Supabase dashboard."
          fi
