name: Supabase Inactivity Keep-Alive

on:
  schedule:
    # Runs every 2 days at 00:00 UTC to prevent Supabase 7-day inactivity pause
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::warning ::SUPABASE_URL or SUPABASE_ANON_KEY secret not configured. Skipping ping."
            exit 0
          fi
          
          echo "Sending keep-alive ping to Supabase..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
            
          echo "Supabase responded with HTTP code: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 500 ]; then
            echo "Keep-alive ping successful. Supabase project is active."
          else
            echo "::error ::Supabase ping failed with HTTP code $RESPONSE"
            exit 1
          fi
